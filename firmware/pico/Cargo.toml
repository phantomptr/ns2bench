[package]
name = "ns2bench-pico"
description = "NS2Bench Bridge firmware for a Raspberry Pi Pico (RP2040): console-facing USB HID, host link over UART"
version = "0.0.6"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-usb = "0.6"
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-io-async = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.7"
heapless = "0.9"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
