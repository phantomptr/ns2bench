<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-labelledby="title desc">
  <title id="title">NS2Bench setup at a glance</title>
  <desc id="desc">The console in its dock sends HDMI to a USB capture card, which gives the computer video and audio. An input device plugs into the dock's USB port and gets commands from the computer over a network or serial link. An optional isolated console network has no internet. AI agents talk to NS2Bench on the computer through the HTTP API or MCP at 127.0.0.1:7630.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111214}
    .ti{font-size:22px;font-weight:700}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#4a5260}
    .p{font-size:10px;fill:#4a5260}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .c{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .hdmi{stroke:#2563eb}.usb{stroke:#16a34a}.lan{stroke:#8b5cf6}.link{stroke:#64748b}.api{stroke:#64748b;stroke-dasharray:2 8}
    .lh{fill:#1d4ed8;font-weight:600}.lu{fill:#15803d;font-weight:600}.ll{fill:#6d28d9;font-weight:600}.lk{fill:#475569;font-weight:600}
    .box{fill:#fff;stroke:#c9ced6;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <mask id="ns2b-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="140">
      <rect width="240" height="140" fill="#fff"/>
      <rect x="61" y="31" width="118" height="68" rx="3" fill="#000"/>
      <circle cx="31" cy="45" r="9.5" fill="#000"/><circle cx="31" cy="45" r="5.5" fill="#fff"/>
      <circle cx="31" cy="69" r="3.6" fill="#000"/><circle cx="22.5" cy="77.5" r="3.6" fill="#000"/>
      <circle cx="39.5" cy="77.5" r="3.6" fill="#000"/><circle cx="31" cy="86" r="3.6" fill="#000"/>
      <circle cx="209" cy="36" r="3.6" fill="#000"/><circle cx="200.5" cy="44.5" r="3.6" fill="#000"/>
      <circle cx="217.5" cy="44.5" r="3.6" fill="#000"/><circle cx="209" cy="53" r="3.6" fill="#000"/>
      <circle cx="209" cy="80" r="9.5" fill="#000"/><circle cx="209" cy="80" r="5.5" fill="#fff"/>
    </mask>
  </defs>

  <rect width="900" height="590" rx="16" fill="#f6f7f9"/>

  <!-- NS2Bench mark -->
  <svg x="806" y="22" width="62" height="36" viewBox="0 0 240 140" fill="#111214">
    <g mask="url(#ns2b-cut)">
      <path d="M51 18 H31 Q9 18 9 40 V90 Q9 112 31 112 H51 Z"/>
      <rect x="55" y="24" width="130" height="82" rx="4"/>
      <path d="M189 18 H209 Q231 18 231 40 V90 Q231 112 209 112 H189 Z"/>
    </g>
    <path d="M76 52 L90 63.5 L76 75" fill="none" stroke="#111214" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="70" width="22" height="6.5" rx="3.2"/>
    <rect x="2" y="117" width="236" height="7" rx="3.5"/>
    <rect x="20" y="124" width="7" height="13" rx="2"/><rect x="213" y="124" width="7" height="13" rx="2"/>
  </svg>

  <text class="ti" x="32" y="48">NS2Bench setup at a glance</text>
  <text class="s" x="32" y="70">Eyes: HDMI capture. Hands: a USB input device. The console stays offline.</text>

  <!-- console in dock -->
  <g transform="translate(30,110)">
    <rect x="10" y="0" width="200" height="92" rx="16" fill="#3a4049"/>
    <rect x="50" y="0" width="120" height="92" fill="#23272d"/>
    <rect x="58" y="8" width="104" height="44" rx="3" fill="#cfe0f5"/>
    <circle cx="30" cy="26" r="8" fill="#23272d"/><circle cx="190" cy="40" r="8" fill="#23272d"/>
    <circle cx="190" cy="16" r="3" fill="#23272d"/><circle cx="30" cy="46" r="3" fill="#23272d"/>
    <rect x="30" y="56" width="160" height="100" rx="10" fill="#e3e6eb" stroke="#9aa3ae" stroke-width="1.5"/>
    <text class="p" x="66" y="140" text-anchor="middle">dock</text>
    <rect x="186" y="80" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="88" text-anchor="end">HDMI</text>
    <rect x="186" y="104" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="112" text-anchor="end">USB</text>
    <rect x="186" y="128" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="136" text-anchor="end">LAN</text>
    <text class="h" x="110" y="180" text-anchor="middle">Console in its dock</text>
  </g>

  <!-- capture card -->
  <text class="h" x="415" y="158" text-anchor="middle">USB capture card</text>
  <rect class="box" x="350" y="170" width="130" height="48" rx="8"/>
  <rect x="344" y="186" width="6" height="16" rx="1" fill="#2b2f36"/><rect x="480" y="186" width="6" height="16" rx="1" fill="#2b2f36"/>
  <text class="s" x="415" y="199" text-anchor="middle">UVC · 1080p60</text>
  <path class="c hdmi" d="M226 194 H340" marker-end="url(#ab)"/>
  <text class="s lh" x="286" y="185" text-anchor="middle">HDMI</text>
  <path class="c usb" d="M486 194 H622" marker-end="url(#ag)"/>
  <text class="s lu" x="555" y="185" text-anchor="middle">USB · video + audio</text>

  <!-- computer -->
  <rect x="630" y="96" width="230" height="150" rx="8" fill="#fff" stroke="#2b2f36" stroke-width="3"/>
  <text class="h" x="745" y="128" text-anchor="middle">NS2Bench</text>
  <text class="s" x="745" y="150" text-anchor="middle">live view · you drive in the browser</text>
  <line x1="650" y1="166" x2="840" y2="166" stroke="#e3e6eb" stroke-width="1.5"/>
  <text class="s" x="745" y="188" text-anchor="middle">HTTP API + MCP</text>
  <text class="m" x="745" y="208" text-anchor="middle">127.0.0.1:7630</text>
  <path d="M610 246 H880 L868 262 H622 Z" fill="#d5dae1" stroke="#2b2f36" stroke-width="2" stroke-linejoin="round"/>
  <text class="h" x="745" y="284" text-anchor="middle">Your computer</text>
  <text class="s" x="745" y="301" text-anchor="middle">macOS · Linux · Windows</text>

  <!-- input device -->
  <rect class="box" x="335" y="300" width="160" height="60" rx="8"/>
  <rect x="345" y="312" width="34" height="36" rx="3" fill="#1f7a4d"/>
  <rect x="353" y="321" width="18" height="18" rx="1.5" fill="#15171a"/>
  <text class="h" x="388" y="326">Input device</text>
  <text class="s" x="388" y="344">NS2Bench Bridge</text>
  <text class="s" x="415" y="378" text-anchor="middle">console sees a controller,</text>
  <text class="s" x="415" y="394" text-anchor="middle">keyboard and mouse</text>
  <path class="c usb" d="M335 330 H262 V218 H232" marker-end="url(#ag)"/>
  <text class="s lu" x="298" y="322" text-anchor="middle">USB</text>
  <path class="c link" d="M650 266 V330 H501" marker-end="url(#as)"/>
  <text class="s lk" x="572" y="304" text-anchor="middle">commands</text><text class="s lk" x="572" y="320" text-anchor="middle">LAN or serial</text>

  <!-- agents -->
  <rect class="box" x="630" y="410" width="230" height="64" rx="10"/>
  <rect x="644" y="426" width="32" height="28" rx="7" fill="#64748b"/>
  <circle cx="654" cy="439" r="3.5" fill="#fff"/><circle cx="666" cy="439" r="3.5" fill="#fff"/>
  <line x1="660" y1="420" x2="660" y2="426" stroke="#64748b" stroke-width="3"/>
  <text class="h" x="688" y="438">AI agents</text>
  <text class="s" x="688" y="456">Claude Code, Codex, opencode</text>
  <path class="c api" d="M845 404 V276" marker-start="url(#as)" marker-end="url(#as)"/>
  <text class="s lk" x="835" y="350" text-anchor="end">HTTP API</text>
  <text class="s lk" x="835" y="366" text-anchor="end">or MCP</text>

  <!-- optional console network -->
  <rect x="335" y="430" width="160" height="60" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="h" x="415" y="456" text-anchor="middle">Console network</text>
  <text class="s" x="415" y="474" text-anchor="middle">optional · offline</text>
  <path class="c lan" d="M232 242 H244 V460 H329"/>
  <text class="s ll" x="252" y="452">Ethernet</text>
  <g transform="translate(540,460)">
    <circle r="14" fill="none" stroke="#64748b" stroke-width="2"/>
    <ellipse rx="6" ry="14" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="s" x="415" y="510" text-anchor="middle">no internet: NS2Bench never shares it</text>

  <!-- legend -->
  <g transform="translate(32,552)">
    <line x1="0" y1="0" x2="26" y2="0" class="c hdmi"/><text class="s" x="34" y="4">HDMI</text>
    <line x1="90" y1="0" x2="116" y2="0" class="c usb"/><text class="s" x="124" y="4">USB</text>
    <line x1="170" y1="0" x2="196" y2="0" class="c link"/><text class="s" x="204" y="4">Bridge link (LAN or serial)</text>
    <line x1="380" y1="0" x2="406" y2="0" class="c lan"/><text class="s" x="414" y="4">Console Ethernet</text>
    <line x1="540" y1="0" x2="566" y2="0" class="c api"/><text class="s" x="574" y="4">software (HTTP API / MCP)</text>
  </g>
</svg>
