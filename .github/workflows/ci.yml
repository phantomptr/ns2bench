name: ci
on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repo:
    name: repo checks (versions, i18n, scripts, docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - name: Version files agree with VERSION
        run: node scripts/update-version.mjs --check
      - name: Every language has every interface string
        run: node scripts/i18n.mjs --check
      - name: Script tests
        run: node --test scripts/*.test.mjs
      - name: CHANGELOG has notes for VERSION
        run: node scripts/changelog.mjs notes "$(cat VERSION)" > /dev/null
      - name: Web UI scripts parse
        run: for f in web/*.js site/*.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Board scripts syntax
        run: |
          for script in board/gadget.sh board/ns2bench-hidd.sh board/install.sh board/swap.sh board/S98ns2bench-swap board/quirks/*.sh scripts/*.sh; do
            sh -n "$script"
          done
          bash -n board/restore-default-gadget.sh
      - name: No personal or local files tracked
        run: |
          bad="$(git ls-files | grep -E '(^|/)(bench\.json|AGENTS\.md|CLAUDE\.md|TODO\.md|.*\.token)$' || true)"
          if [ -n "$bad" ]; then echo "::error::tracked local files: $bad"; exit 1; fi

  rust:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: clippy }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy (warnings are errors)
        working-directory: native
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo clippy --locked --all-targets -p ns2bench-core -p ns2bench -p ns2bench-netd -p ns2bench-tools -p ns2bench-app -- -D warnings
          else
            cargo clippy --locked --workspace --all-targets -- -D warnings
          fi
      - name: Tests
        working-directory: native
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test --locked -p ns2bench-core -p ns2bench -p ns2bench-netd -p ns2bench-tools -p ns2bench-app
          else
            cargo test --locked --workspace
          fi

  board:
    name: Bridge daemon + Pico firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl,thumbv6m-none-eabi" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            firmware/pico/target
          key: board-${{ hashFiles('native/Cargo.lock', 'firmware/pico/Cargo.lock') }}
          restore-keys: board-
      - run: make board
      - run: make board BOARD_TARGET=aarch64-unknown-linux-musl
      - run: make pico
      - name: Binaries are static
        run: |
          file native/target/armv7-unknown-linux-musleabihf/release/ns2bench-board | grep -q 'statically linked'
          file native/target/aarch64-unknown-linux-musl/release/ns2bench-board | grep -q 'statically linked'
          test -s firmware/pico/ns2bench-pico.uf2
