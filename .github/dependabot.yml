version: 2
updates:
  - package-ecosystem: cargo
    directory: /native
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }   # let hijacked releases get yanked first; security updates aren't delayed
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /firmware/pico
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
