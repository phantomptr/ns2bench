name: Feature request
description: An idea for NS2Bench
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could NS2Bench help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
