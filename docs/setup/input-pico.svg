<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Input: Raspberry Pi Pico (Serial Bridge)</title>
  <desc id="desc">The Pico's micro-USB port plugs into the console dock's USB port. Pico UART0 pin GP0 (TX) goes to the adapter's RX, GP1 (RX) comes from the adapter's TX, and GND goes to GND. The 3.3 V USB-to-UART adapter plugs into the computer by USB. The link runs at 921600 baud.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111214}
    .ti{font-size:22px;font-weight:700}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#4a5260}
    .p{font-size:10px;fill:#4a5260}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .c{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .usb{stroke:#16a34a}.uart{stroke:#ea8a0b}.gnd{stroke:#2b2f36}
    .lu{fill:#15803d;font-weight:600}.lo{fill:#b45309;font-weight:600}
    .box{fill:#fff;stroke:#c9ced6;stroke-width:1.5}
    .chip{fill:#fff;stroke:#c9ced6;stroke-width:1.2}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea8a0b"/></marker>
  </defs>

  <rect width="900" height="600" rx="16" fill="#f6f7f9"/>
  <text class="ti" x="32" y="48">Input: Raspberry Pi Pico</text>
  <text class="s" x="32" y="70">RP2040 Pico running NS2Bench Bridge firmware. Its USB goes to the console; a USB-to-UART adapter links it to the computer.</text>
  <text class="s" x="32" y="88">NS2Bench Settings → Devices → Input connection: Serial Bridge, 921600 baud.</text>

  <!-- console in dock -->
  <g transform="translate(30,130)">
    <rect x="10" y="0" width="200" height="92" rx="16" fill="#3a4049"/>
    <rect x="50" y="0" width="120" height="92" fill="#23272d"/>
    <rect x="58" y="8" width="104" height="44" rx="3" fill="#cfe0f5"/>
    <circle cx="30" cy="26" r="8" fill="#23272d"/><circle cx="190" cy="40" r="8" fill="#23272d"/>
    <circle cx="190" cy="16" r="3" fill="#23272d"/><circle cx="30" cy="46" r="3" fill="#23272d"/>
    <rect x="30" y="56" width="160" height="100" rx="10" fill="#e3e6eb" stroke="#9aa3ae" stroke-width="1.5"/>
    <text class="p" x="66" y="140" text-anchor="middle">dock</text>
    <rect x="186" y="80" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="88" text-anchor="end">HDMI</text>
    <rect x="186" y="104" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="112" text-anchor="end">USB</text>
    <rect x="186" y="128" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="136" text-anchor="end">LAN</text>
    <text class="h" x="110" y="180" text-anchor="middle">Console in its dock</text>
  </g>

  <!-- UART wires -->
  <text class="s lo" x="447" y="158" text-anchor="middle">UART · 921600 baud</text>
  <path class="w uart" d="M320 216 V168 H575 V208" marker-end="url(#ao)"/>
  <path class="w uart" d="M565 216 V178 H330 V208" marker-end="url(#ao)"/>
  <path class="w gnd" d="M340 216 V188 H555 V216"/>

  <!-- Pico -->
  <rect x="300" y="228" width="12" height="20" rx="2" fill="#c0c6ce" stroke="#6b7480"/>
  <rect x="310" y="214" width="140" height="48" rx="4" fill="#1f7a4d"/>
  <g fill="#e2c26b">
    <circle cx="320" cy="219" r="2.5"/><circle cx="330" cy="219" r="2.5"/><circle cx="340" cy="219" r="2.5"/><circle cx="350" cy="219" r="2"/>
    <circle cx="360" cy="219" r="2"/><circle cx="370" cy="219" r="2"/><circle cx="380" cy="219" r="2"/><circle cx="390" cy="219" r="2"/>
    <circle cx="400" cy="219" r="2"/><circle cx="410" cy="219" r="2"/><circle cx="420" cy="219" r="2"/><circle cx="430" cy="219" r="2"/><circle cx="440" cy="219" r="2"/>
    <circle cx="320" cy="257" r="2"/><circle cx="330" cy="257" r="2"/><circle cx="340" cy="257" r="2"/><circle cx="350" cy="257" r="2"/>
    <circle cx="360" cy="257" r="2"/><circle cx="370" cy="257" r="2"/><circle cx="380" cy="257" r="2"/><circle cx="390" cy="257" r="2"/>
    <circle cx="400" cy="257" r="2"/><circle cx="410" cy="257" r="2"/><circle cx="420" cy="257" r="2"/><circle cx="430" cy="257" r="2"/><circle cx="440" cy="257" r="2"/>
  </g>
  <rect x="372" y="226" width="26" height="24" rx="2" fill="#15171a"/>
  <rect x="330" y="232" width="12" height="12" rx="2" fill="#f1f3f5"/>
  <text class="h" x="380" y="284" text-anchor="middle">Raspberry Pi Pico</text>
  <text class="s" x="380" y="302" text-anchor="middle">NS2Bench Bridge firmware</text>
  <path class="c usb" d="M300 238 H232" marker-end="url(#ag)"/>
  <text class="s lu" x="266" y="229" text-anchor="middle">micro-USB</text>

  <!-- adapter -->
  <rect x="520" y="214" width="90" height="48" rx="4" fill="#1d4e89"/>
  <g fill="#e2c26b"><circle cx="555" cy="219" r="2.5"/><circle cx="565" cy="219" r="2.5"/><circle cx="575" cy="219" r="2.5"/><circle cx="545" cy="219" r="2"/><circle cx="585" cy="219" r="2"/></g>
  <rect x="540" y="232" width="20" height="20" rx="2" fill="#15171a"/>
  <rect x="610" y="226" width="26" height="24" rx="2" fill="#c0c6ce" stroke="#6b7480"/>
  <text class="h" x="565" y="284" text-anchor="middle">USB-to-UART adapter</text>
  <text class="s" x="565" y="302" text-anchor="middle">3.3 V · CP2102 / FT232 / CH340</text>
  <path class="c usb" d="M636 238 H690" marker-end="url(#ag)"/>
  <text class="s lu" x="664" y="229" text-anchor="middle">USB</text>

  <!-- computer -->
  <rect x="700" y="160" width="168" height="110" rx="8" fill="#fff" stroke="#2b2f36" stroke-width="3"/>
  <text class="h" x="784" y="186" text-anchor="middle">NS2Bench</text>
  <text class="m" x="784" y="207" text-anchor="middle">Serial Bridge</text>
  <text class="m" x="784" y="226" text-anchor="middle">921600 baud</text>
  <rect x="712" y="238" width="144" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="784" y="253" text-anchor="middle" style="font-size:11px;fill:#14532d;font-weight:600">Bridge · usb configured</text>
  <path d="M684 270 H884 L874 286 H694 Z" fill="#d5dae1" stroke="#2b2f36" stroke-width="2" stroke-linejoin="round"/>
  <text class="h" x="784" y="308" text-anchor="middle">Your computer</text>

  <!-- pin inset -->
  <rect class="box" x="32" y="336" width="414" height="214" rx="10"/>
  <text class="h" x="48" y="362">Wiring: 3 wires, 3.3 V logic</text>
  <text class="p" x="133" y="388" text-anchor="middle">PICO</text>
  <text class="p" x="350" y="388" text-anchor="middle">ADAPTER</text>
  <rect class="chip" x="48" y="398" width="170" height="26" rx="6"/><text class="m" x="58" y="416">pin 1 · GP0 (TX)</text>
  <rect class="chip" x="300" y="398" width="100" height="26" rx="6"/><text class="m" x="350" y="416" text-anchor="middle">RX</text>
  <path class="w uart" d="M222 411 H292" marker-end="url(#ao)"/>
  <rect class="chip" x="48" y="432" width="170" height="26" rx="6"/><text class="m" x="58" y="450">pin 2 · GP1 (RX)</text>
  <rect class="chip" x="300" y="432" width="100" height="26" rx="6"/><text class="m" x="350" y="450" text-anchor="middle">TX</text>
  <path class="w uart" d="M296 445 H226" marker-end="url(#ao)"/>
  <rect class="chip" x="48" y="466" width="170" height="26" rx="6"/><text class="m" x="58" y="484">pin 3 · GND</text>
  <rect class="chip" x="300" y="466" width="100" height="26" rx="6"/><text class="m" x="350" y="484" text-anchor="middle">GND</text>
  <path class="w gnd" d="M222 479 H296"/>
  <text class="s" x="48" y="516">Leave the adapter's 3.3 V / 5 V pin unconnected.</text>
  <text class="s" x="48" y="534">The Pico is powered by the console's USB.</text>

  <!-- flashing -->
  <rect class="box" x="462" y="336" width="406" height="214" rx="10"/>
  <text class="h" x="478" y="362">Flash the firmware once</text>
  <text class="s" x="478" y="388">1. Build it:</text><text class="m" x="550" y="388">make pico</text><text class="s" x="626" y="388">→ ns2bench-pico.uf2</text>
  <text class="s" x="478" y="410">2. Hold BOOTSEL while you plug the Pico into the computer.</text>
  <text class="s" x="478" y="432">3. Copy the .uf2 onto the RPI-RP2 drive. It restarts.</text>
  <text class="s" x="478" y="454">4. Unplug it, then plug the Pico into the console.</text>
  <line x1="478" y1="474" x2="852" y2="474" stroke="#e3e6eb" stroke-width="1.5"/>
  <text class="s" x="478" y="498">In Settings → Devices pick Serial Bridge, the adapter's</text>
  <text class="s" x="478" y="516">port (/dev/cu.usbserial-… or COM3) and 921600 baud.</text>

  <!-- legend -->
  <g transform="translate(32,576)">
    <line x1="0" y1="0" x2="26" y2="0" class="c usb"/><text class="s" x="34" y="4">USB</text>
    <line x1="90" y1="0" x2="116" y2="0" class="c uart"/><text class="s" x="124" y="4">Serial / UART (TX, RX)</text>
    <line x1="290" y1="0" x2="316" y2="0" class="c gnd"/><text class="s" x="324" y="4">Ground</text>
  </g>
</svg>
