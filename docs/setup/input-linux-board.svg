<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Input: Linux USB-gadget board (Network Bridge)</title>
  <desc id="desc">The board's OTG USB port plugs into the console dock's USB port, so the console sees a wired controller, keyboard and mouse, or a Pro Controller in Pro mode. The board's Ethernet, Wi-Fi or USB network connects to the computer. NS2Bench reaches the Bridge at TCP 192.168.79.2 port 7631 with the token file ~/.ns2bench/hidd.token.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111214}
    .ti{font-size:22px;font-weight:700}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#4a5260}
    .p{font-size:10px;fill:#4a5260}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .c{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .usb{stroke:#16a34a}.lan{stroke:#8b5cf6}
    .lu{fill:#15803d;font-weight:600}.ll{fill:#6d28d9;font-weight:600}
    .box{fill:#fff;stroke:#c9ced6;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
  </defs>

  <rect width="900" height="560" rx="16" fill="#f6f7f9"/>
  <text class="ti" x="32" y="48">Input: Linux USB-gadget board</text>
  <text class="s" x="32" y="70">Luckfox Pico Pro/Max, Raspberry Pi Zero 2 W, Pi 4/5 (USB-C OTG), or any Linux board with USB device mode.</text>
  <text class="s" x="32" y="88">NS2Bench Settings → Devices → Input connection: Network Bridge.</text>

  <!-- console in dock -->
  <g transform="translate(30,130)">
    <rect x="10" y="0" width="200" height="92" rx="16" fill="#3a4049"/>
    <rect x="50" y="0" width="120" height="92" fill="#23272d"/>
    <rect x="58" y="8" width="104" height="44" rx="3" fill="#cfe0f5"/>
    <circle cx="30" cy="26" r="8" fill="#23272d"/><circle cx="190" cy="40" r="8" fill="#23272d"/>
    <circle cx="190" cy="16" r="3" fill="#23272d"/><circle cx="30" cy="46" r="3" fill="#23272d"/>
    <rect x="30" y="56" width="160" height="100" rx="10" fill="#e3e6eb" stroke="#9aa3ae" stroke-width="1.5"/>
    <text class="p" x="66" y="140" text-anchor="middle">dock</text>
    <rect x="186" y="80" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="88" text-anchor="end">HDMI</text>
    <rect x="186" y="104" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="112" text-anchor="end">USB</text>
    <rect x="186" y="128" width="10" height="8" rx="1.5" fill="#2b2f36"/><text class="p" x="180" y="136" text-anchor="end">LAN</text>
    <text class="h" x="110" y="180" text-anchor="middle">Console in its dock</text>
  </g>

  <!-- board -->
  <text class="h" x="440" y="174" text-anchor="middle">Linux board</text>
  <rect x="340" y="190" width="200" height="100" rx="8" fill="#1f7a4d"/>
  <g fill="#e2c26b">
    <circle cx="362" cy="200" r="2.5"/><circle cx="374" cy="200" r="2.5"/><circle cx="386" cy="200" r="2.5"/><circle cx="398" cy="200" r="2.5"/>
    <circle cx="410" cy="200" r="2.5"/><circle cx="422" cy="200" r="2.5"/><circle cx="434" cy="200" r="2.5"/><circle cx="446" cy="200" r="2.5"/>
    <circle cx="458" cy="200" r="2.5"/><circle cx="470" cy="200" r="2.5"/><circle cx="482" cy="200" r="2.5"/><circle cx="494" cy="200" r="2.5"/>
    <circle cx="362" cy="280" r="2.5"/><circle cx="374" cy="280" r="2.5"/><circle cx="386" cy="280" r="2.5"/><circle cx="398" cy="280" r="2.5"/>
    <circle cx="410" cy="280" r="2.5"/><circle cx="422" cy="280" r="2.5"/><circle cx="434" cy="280" r="2.5"/><circle cx="446" cy="280" r="2.5"/>
    <circle cx="458" cy="280" r="2.5"/><circle cx="470" cy="280" r="2.5"/><circle cx="482" cy="280" r="2.5"/><circle cx="494" cy="280" r="2.5"/>
  </g>
  <rect x="412" y="216" width="50" height="48" rx="3" fill="#15171a"/>
  <rect x="372" y="222" width="22" height="14" rx="2" fill="#15171a"/>
  <circle cx="512" cy="266" r="3" fill="#7ee08a"/>
  <rect x="332" y="228" width="12" height="20" rx="2" fill="#c0c6ce" stroke="#6b7480"/>
  <text class="p" x="350" y="262" style="fill:#e8f5ee">OTG</text>
  <rect x="528" y="222" width="22" height="28" rx="2" fill="#c0c6ce" stroke="#6b7480"/>
  <text class="s" x="440" y="312" text-anchor="middle">NS2Bench Bridge (ns2bench-board)</text>
  <text class="m" x="440" y="330" text-anchor="middle">TCP 192.168.79.2:7631</text>

  <path class="c usb" d="M332 238 H232" marker-end="url(#ag)"/>
  <text class="s lu" x="282" y="230" text-anchor="middle">USB</text>
  <text class="s" x="440" y="356" text-anchor="middle">The console sees a wired controller + keyboard + mouse, or a Pro Controller in Pro mode.</text>

  <!-- computer -->
  <path class="c lan" d="M556 236 H628" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <text class="s ll" x="592" y="226" text-anchor="middle">Ethernet</text>
  <text class="p" x="588" y="256" text-anchor="middle">or Wi-Fi / USB net</text>
  <rect x="640" y="150" width="220" height="120" rx="8" fill="#fff" stroke="#2b2f36" stroke-width="3"/>
  <text class="h" x="750" y="178" text-anchor="middle">NS2Bench</text>
  <text class="s" x="750" y="198" text-anchor="middle">Settings → Devices</text>
  <text class="m" x="750" y="218" text-anchor="middle">Network Bridge</text>
  <rect x="664" y="234" width="172" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="249" text-anchor="middle" style="font-size:11px;fill:#14532d;font-weight:600">Bridge 2 ms · usb configured</text>
  <path d="M620 270 H880 L868 286 H632 Z" fill="#d5dae1" stroke="#2b2f36" stroke-width="2" stroke-linejoin="round"/>
  <text class="h" x="750" y="308" text-anchor="middle">Your computer</text>

  <!-- settings box -->
  <rect class="box" x="32" y="380" width="414" height="128" rx="10"/>
  <text class="h" x="48" y="404">Settings → Devices</text>
  <text class="s" x="48" y="428">Input connection</text><text class="m" x="180" y="428">Network Bridge</text>
  <text class="s" x="48" y="450">Bridge address</text><text class="m" x="180" y="450">192.168.79.2</text><text class="p" x="282" y="450">(the board's IP)</text>
  <text class="s" x="48" y="472">Bridge port</text><text class="m" x="180" y="472">7631</text>
  <text class="s" x="48" y="494">Bridge token file</text><text class="m" x="180" y="494">~/.ns2bench/hidd.token</text>

  <!-- sleep box -->
  <rect class="box" x="462" y="380" width="406" height="128" rx="10"/>
  <text class="h" x="478" y="404">When the console sleeps</text>
  <text class="s" x="478" y="428">A board powered by the console's USB reboots when</text>
  <text class="s" x="478" y="446">the console sleeps. Keep NS2Bench running: it</text>
  <text class="s" x="478" y="464">reconnects by itself. The board needs a boot script that</text>
  <text class="s" x="478" y="482">runs gadget.sh, then ns2bench-hidd.sh start.</text>

  <!-- legend -->
  <g transform="translate(32,534)">
    <line x1="0" y1="0" x2="26" y2="0" class="c usb"/><text class="s" x="34" y="4">USB</text>
    <line x1="90" y1="0" x2="116" y2="0" class="c lan"/><text class="s" x="124" y="4">Ethernet / LAN (Bridge link)</text>
  </g>
</svg>
