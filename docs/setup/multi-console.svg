<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Several consoles on one bench</title>
  <desc id="desc">Two consoles, each with its own capture card into the computer and its own network address. One controller, a Luckfox board, is shared: its USB cable is plugged into one console at a time, moved by hand, and NS2Bench is told which console it is on.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111214}
    .ti{font-size:22px;font-weight:700}
    .h{font-size:15px;font-weight:600}
    .s{font-size:12px;fill:#4a5260}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .panel{fill:#fff;stroke:#dfe3e8;stroke-width:1.5}
    .hdmi{stroke:#2563eb;stroke-width:4;fill:none;stroke-linecap:round}
    .usb{stroke:#16a34a;stroke-width:4;fill:none;stroke-linecap:round}
    .moved{stroke:#16a34a;stroke-width:3;fill:none;stroke-dasharray:6 7;stroke-linecap:round}
    .lan{stroke:#8b5cf6;stroke-width:3;fill:none;stroke-linecap:round}
    .lb{fill:#1d4ed8;font-weight:600;font-size:12px}.lg{fill:#15803d;font-weight:600;font-size:12px}.lp{fill:#6d28d9;font-weight:600;font-size:12px}
  </style>
  <rect width="900" height="470" fill="#fbfbfc"/>
  <text class="ti" x="30" y="40">Several consoles, one controller</text>
  <text class="s" x="30" y="62">Each console: its own capture card and network address. The controller's USB cable goes to one console at a time.</text>

  <!-- consoles -->
  <rect x="30" y="100" width="230" height="110" rx="14" class="panel" stroke="#e60012" stroke-width="2.5"/>
  <circle cx="52" cy="124" r="7" fill="#e60012"/>
  <text class="h" x="66" y="129">Switch 2</text>
  <text class="s" x="46" y="152">Switch 2 · Pro Controller mode</text>
  <text class="m" x="46" y="174">network 192.168.86.251</text>
  <text class="s" x="46" y="196">controller plugged in here now</text>

  <rect x="30" y="300" width="230" height="110" rx="14" class="panel" stroke="#0ab9e6" stroke-width="2.5"/>
  <circle cx="52" cy="324" r="7" fill="#0ab9e6"/>
  <text class="h" x="66" y="329">Switch 1</text>
  <text class="s" x="46" y="352">Switch 1 · standard controller</text>
  <text class="m" x="46" y="374">network 192.168.86.252</text>
  <text class="s" x="46" y="396">controller: move its cable here</text>

  <!-- capture cards -->
  <rect x="360" y="120" width="170" height="60" rx="10" class="panel"/>
  <text class="h" x="445" y="146" text-anchor="middle">Capture card 1</text>
  <text class="s" x="445" y="166" text-anchor="middle">picture + sound</text>
  <rect x="360" y="320" width="170" height="60" rx="10" class="panel"/>
  <text class="h" x="445" y="346" text-anchor="middle">Capture card 2</text>
  <text class="s" x="445" y="366" text-anchor="middle">picture + sound</text>
  <path class="hdmi" d="M260 150 H360"/><text class="lb" x="310" y="142" text-anchor="middle">HDMI</text>
  <path class="hdmi" d="M260 350 H360"/><text class="lb" x="310" y="342" text-anchor="middle">HDMI</text>

  <!-- computer -->
  <rect x="640" y="150" width="230" height="200" rx="14" class="panel"/>
  <text class="h" x="656" y="178">Computer with NS2Bench</text>
  <text class="s" x="656" y="202">Console bar: watch either one</text>
  <text class="s" x="656" y="222">Each: picture, sound, clips,</text>
  <text class="s" x="656" y="240">screen reading, tests</text>
  <text class="s" x="656" y="266">Input goes only to the console</text>
  <text class="s" x="656" y="284">the controller is plugged into</text>
  <text class="s" x="656" y="310">Cable moved? It asks where.</text>
  <path class="usb" d="M530 150 C 580 150, 600 200, 640 205"/>
  <path class="usb" d="M530 350 C 580 350, 600 300, 640 295"/>
  <text class="lg" x="585" y="140" text-anchor="middle">USB</text>
  <text class="lg" x="585" y="370" text-anchor="middle">USB</text>

  <!-- controller -->
  <rect x="330" y="215" width="230" height="70" rx="12" class="panel"/>
  <text class="h" x="346" y="240">Controller (Luckfox)</text>
  <text class="s" x="346" y="262">NS2Bench Bridge · LAN to computer</text>
  <path class="lan" d="M560 250 H640"/><text class="lp" x="600" y="244" text-anchor="middle">LAN</text>
  <path class="usb" d="M330 240 C 300 240, 290 190, 260 185"/>
  <path class="moved" d="M330 262 C 300 262, 290 312, 260 318"/>
  <text class="lg" x="282" y="228" text-anchor="end">USB, now</text>
  <text class="lg" x="282" y="290" text-anchor="end">or here</text>
</svg>
