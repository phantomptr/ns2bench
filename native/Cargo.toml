[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/board", "crates/app", "crates/netd", "crates/tools"]

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/phantomptr/ns2bench"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mime_guess = "2"
rand = "0.10"
regex = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# image decoding/diffing is far too slow unoptimised; dependencies are always optimised
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
