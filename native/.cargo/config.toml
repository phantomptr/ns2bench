# Board binaries: fully static so they run on any Linux board (uClibc, glibc, musl) with no runtime.
#   cargo build --release -p ns2bench-board --target armv7-unknown-linux-musleabihf   (Luckfox, Pi 2/3 32-bit)
#   cargo build --release -p ns2bench-board --target aarch64-unknown-linux-musl       (Pi 3/4/5 64-bit)
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
