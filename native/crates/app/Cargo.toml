[package]
name = "ns2bench-app"
description = "NS2Bench desktop app: the bench UI in a native window with the engine built in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ns2bench-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
ns2bench-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde_json.workspace = true
tokio.workspace = true
serde.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
sha2 = "0.11"
semver = "1"
futures.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
