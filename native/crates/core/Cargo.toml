[package]
name = "ns2bench-core"
description = "NS2Bench engine: capture, input, OCR, tests, recorder, HTTP/WebSocket API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
image.workspace = true
# brightness-only JPEG decode for frame comparison (already used by `image`)
zune-jpeg = "0.5"
mime_guess.workspace = true
rand.workspace = true
regex.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zip.workspace = true
ns2bench-netd = { path = "../netd" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Communication", "Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
